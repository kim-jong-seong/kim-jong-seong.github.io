<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>이번 역은</title>
<!-- 네이버 서치어드바이저 소유 확인 태그는 여기(head 안)에 넣는다. 자바스크립트·meta refresh 이동은 확인이 안 되므로 쓰지 않는다 -->
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #14181b; color: #f1f5f3;
         font-family: "Apple SD Gothic Neo", "Pretendard Variable", system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; word-break: keep-all; }
  h1 { margin: 0 0 12px; font-size: 32px; letter-spacing: -0.03em; }
  p { margin: 0 0 24px; color: #9ba6a2; }
  a { display: inline-block; padding: 14px 22px; border-radius: 14px; background: #f1f5f3; color: #0c0f10; font-weight: 700; text-decoration: none; }
  a:focus-visible { outline: 3px solid #00aae6; outline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <h1>이번 역은</h1>
    <p>지하철·버스 실시간 알림 앱</p>
    <a href="subwaySite/">앱 소개 보러 가기</a>
  </main>
</body>
</html>
